name: 6-Hour Verification Reminders

on:
  schedule:
    # Runs every 6 hours at minute 0 (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  dispatch-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          REMINDER_URL: ${{ vars.REMINDER_URL || 'https://herlookutaskninja.vercel.app' }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "::warning::CRON_SECRET is not set as a repository secret; calling the endpoint unauthenticated."
            AUTH_HEADER=()
          else
            AUTH_HEADER=(-H "Authorization: Bearer ${CRON_SECRET}")
          fi

          BODY_FILE="$(mktemp)"
          STATUS="$(curl --silent --show-error --output "${BODY_FILE}" --write-out '%{http_code}' \
            -X POST "${REMINDER_URL}/api/cron/id-verification-reminders" \
            "${AUTH_HEADER[@]}" \
            -H "Content-Type: application/json")"

          echo "HTTP ${STATUS}"
          cat "${BODY_FILE}"
          echo

          if [ "${STATUS}" -lt 200 ] || [ "${STATUS}" -ge 300 ]; then
            echo "::error::Reminder endpoint returned HTTP ${STATUS}."
            exit 1
          fi

          if grep -q '"failed":[1-9]' "${BODY_FILE}"; then
            echo "::warning::Some push notifications failed to send; see the response body above."
          fi
